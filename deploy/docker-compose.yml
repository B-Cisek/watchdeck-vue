# Copied to the VPS (/opt/watchdeck-vue) by .github/workflows/deploy.yml on every deploy.
# Values come from .env (Traefik settings, managed by hand on the VPS)
# and .deploy.env (IMAGE_TAG, written by CI).
#
# The app calls a relative /api, so the browser only ever talks to DOMAIN and the
# session cookie stays first-party (backend has no CORS, cookie is SameSite=Lax).
# The watchdeck-vue-api router sends DOMAIN/api/* to the backend's Traefik service
# (defined by ../watchdeck, which keeps its own API domain as well). Its longer
# rule gives it priority over the catch-all Host() router of the SPA.
services:
  web:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/watchdeck-vue:${IMAGE_TAG:-latest}
    container_name: watchdeck-vue
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.watchdeck-vue.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.watchdeck-vue.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.watchdeck-vue.tls=true
      - traefik.http.routers.watchdeck-vue.tls.certresolver=${TRAEFIK_CERTRESOLVER:-cf}
      - traefik.http.middlewares.watchdeck-vue-compress.compress=true
      - traefik.http.routers.watchdeck-vue.middlewares=watchdeck-vue-compress
      - traefik.http.services.watchdeck-vue.loadbalancer.server.port=8080
      - traefik.http.routers.watchdeck-vue-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.watchdeck-vue-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.watchdeck-vue-api.tls=true
      - traefik.http.routers.watchdeck-vue-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-cf}
      - traefik.http.routers.watchdeck-vue-api.middlewares=watchdeck-vue-compress
      - traefik.http.routers.watchdeck-vue-api.service=${API_SERVICE:-watchdeck@docker}

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
