name: CI

on:
  pull_request:
  # Called by deploy.yml, so a push to main is checked before it is deployed.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; never a run that a deploy is waiting on.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: oxlint
        run: bunx oxlint . --deny-warnings

      - name: ESLint
        run: bunx eslint .

      - name: Type check
        run: bun run type-check

      - name: Tests
        run: bun test --tsconfig-override tsconfig.app.json
